[GENERAL]
application = App\Zalo.exe
!multiple = 2

[BEFORE]
batch = Registry\symlink_setup.bat
file = %APPDATA%\zmeta.json :: Data\Roaming\zmeta.json
regkey = HKCU\Software\vng.zalo.pc :: Registry\a.reg

[AFTER]
batch = Registry\symlink_cleanup.bat
-file = %Start Menu%\Programs\Zalo.lnk
-regkey = HKCU\SOFTWARE\Classes\zalo
-regkey = HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run :: Zalo

