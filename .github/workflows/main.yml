name: Cập nhật Zalo Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lấy phiên bản mới nhất từ winget-pkgs
        id: winget
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "ZaloPC-Portable-Action" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }

          $resp = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/v/VNGCorp/Zalo"

          $versions = $resp | Where-Object { $_.type -eq "dir" } | ForEach-Object { $_.name }
          $latest = $versions | Sort-Object { [version]$_ } | Select-Object -Last 1

          if (-not $latest) { throw "Không lấy được danh sách phiên bản từ winget-pkgs" }

          Write-Host "Phiên bản mới nhất trên winget-pkgs: $latest"
          echo "version=$latest" >> $env:GITHUB_OUTPUT

      - name: Kiểm tra release đã tồn tại chưa
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "Zalo-${{ steps.winget.outputs.version }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          Write-Host "Tag $tag ton tai: $exists"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "exists=$exists" >> $env:GITHUB_OUTPUT

          # gh tra ve exit code 1 khi release chua ton tai (dung y muon).
          # Reset lai de GitHub Actions khong tu dong danh dau buoc nay la loi.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Cài đặt Zalo qua winget
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          winget source update
          winget install --id VNGCorp.Zalo -e `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

      - name: Tìm thư mục vừa cài đặt
        id: locate
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $base = Join-Path $env:LOCALAPPDATA "Programs\Zalo"
          if (-not (Test-Path $base)) { throw "Khong tim thay $base" }

          # Uu tien thu muc phien ban "Zalo-x.y.z" - day moi la du lieu app that su can dong goi
          # (Programs\Zalo\ goc chi chua launcher/stub va cac file dung chung)
          $verDir = Get-ChildItem $base -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^Zalo-\d' -and (Test-Path (Join-Path $_.FullName "Zalo.exe")) } |
            Sort-Object { [version]($_.Name -replace '^Zalo-', '') } |
            Select-Object -Last 1

          if ($verDir) {
            $dir = $verDir
          }
          else {
            # Du phong: mot so kieu cai dat (vd winget --silent) khong tao thu muc phien ban rieng,
            # Zalo.exe nam thang trong thu muc goc -> dung luon thu muc goc
            $rootExe = Join-Path $base "Zalo.exe"
            if (Test-Path $rootExe) {
              $dir = Get-Item $base
            }
            else {
              $exe = Get-ChildItem $base -Recurse -Filter "Zalo.exe" -File -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $exe) { throw "Khong tim thay Zalo.exe ben trong $base" }
              $dir = $exe.Directory
            }
          }

          Write-Host "Thu muc se dong goi: $($dir.FullName)"
          echo "path=$($dir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Nén thư mục cài đặt
        id: zip
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $zipName = "${{ steps.check.outputs.tag }}.zip"
          Compress-Archive -Path "${{ steps.locate.outputs.path }}\*" -DestinationPath $zipName -Force
          Write-Host "Da nen: $zipName"
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - name: Tạo GitHub Release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.check.outputs.tag }}"
          gh release create $tag "${{ steps.zip.outputs.zipname }}" `
            --repo $env:GITHUB_REPOSITORY `
            --title $tag `
            --notes "Tu dong dong goi tu winget-pkgs (VNGCorp.Zalo ${{ steps.winget.outputs.version }})."
