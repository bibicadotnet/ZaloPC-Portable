name: Cập nhật Zalo Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Job 1: quét toàn bộ phiên bản đang có trên winget-pkgs,
  # rồi lọc ra những phiên bản CHƯA có release trên repo này.
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.diff.outputs.versions }}
    steps:
      - name: Lấy toàn bộ phiên bản từ winget-pkgs
        id: winget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "User-Agent: ZaloPC-Portable-Action" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/v/VNGCorp/Zalo")

          versions=$(echo "$resp" | jq -r '.[] | select(.type=="dir") | .name' | sort -V)

          if [ -z "$versions" ]; then
            echo "Không lấy được danh sách phiên bản từ winget-pkgs" >&2
            exit 1
          fi

          echo "Các phiên bản trên winget-pkgs:"
          echo "$versions"

          json=$(echo "$versions" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "all=$json" >> "$GITHUB_OUTPUT"

      - name: Lọc ra các phiên bản chưa có release
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName -q '.[].tagName' | sed -n 's/^Zalo-//p')

          missing=$(echo '${{ steps.winget.outputs.all }}' | jq -c --arg existing "$existing" '
            ($existing | split("\n") | map(select(length > 0))) as $ex
            | map(select(. as $v | ($ex | index($v)) | not))
          ')

          echo "Các phiên bản cần đóng gói: $missing"
          echo "versions=$missing" >> "$GITHUB_OUTPUT"

  # Job 2: mỗi phiên bản còn thiếu chạy 1 job riêng (matrix) trên windows-latest
  # để cài qua winget, đóng gói và tạo release.
  build:
    needs: discover
    if: needs.discover.outputs.versions != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}

    steps:
      - name: Tải & cài đặt Zalo ${{ matrix.version }} (đọc thẳng manifest, không qua winget)
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ matrix.version }}"
          $manifestUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/v/VNGCorp/Zalo/$version/VNGCorp.Zalo.installer.yaml"

          function Get-YamlValue($text, $key) {
            $m = [regex]::Match($text, "(?m)^\s*${key}:\s*(.+)\s*$")
            if ($m.Success) { return $m.Groups[1].Value.Trim() }
            return $null
          }

          $success = $false
          try {
            Write-Host "Doc manifest: $manifestUrl"
            $raw = Invoke-RestMethod -Uri $manifestUrl -UseBasicParsing

            $installerUrl    = Get-YamlValue $raw "InstallerUrl"
            $installerSha256 = Get-YamlValue $raw "InstallerSha256"
            $installerType   = Get-YamlValue $raw "InstallerType"

            if (-not $installerUrl) { throw "Khong doc duoc InstallerUrl tu manifest" }
            Write-Host "InstallerUrl: $installerUrl"
            Write-Host "InstallerType: $installerType"

            $exePath = Join-Path $env:RUNNER_TEMP "ZaloSetup-$version.exe"

            # CDN nay dang bi loi handshake TLS voi .NET mac dinh tren runner (khong phai
            # do file sai). Vi da verify SHA256 tu manifest goc cua Microsoft ben duoi,
            # nen o day co the bo qua kiem tra cert TLS mot cach an toan - tinh toan ven
            # cua file duoc dam bao bang hash chu khong phai bang cert.
            [Net.ServicePointManager]::SecurityProtocol = `
              [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor `
              [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
            [Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }

            function Get-FileMultiMethod($url, $out) {
              # Cach 1: Invoke-WebRequest (HttpClient), bo qua kiem tra cert
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -SkipCertificateCheck -TimeoutSec 120
                return $true
              } catch {
                Write-Warning "Invoke-WebRequest that bai: $($_.Exception.Message)"
              }

              # Cach 2: curl.exe (co san tren windows-latest), stack TLS khac
              try {
                & curl.exe -k -L --fail --silent --show-error -o $out $url
                if ($LASTEXITCODE -eq 0 -and (Test-Path $out)) { return $true }
                Write-Warning "curl.exe that bai (exit code $LASTEXITCODE)"
              } catch {
                Write-Warning "curl.exe loi: $($_.Exception.Message)"
              }

              # Cach 3: BITS transfer, stack mang rieng cua Windows
              try {
                Start-BitsTransfer -Source $url -Destination $out -ErrorAction Stop
                if (Test-Path $out) { return $true }
              } catch {
                Write-Warning "BITS transfer that bai: $($_.Exception.Message)"
              }

              return $false
            }

            $maxAttempts = 3
            $downloaded = $false
            for ($i = 1; $i -le $maxAttempts; $i++) {
              if (Get-FileMultiMethod $installerUrl $exePath) {
                $downloaded = $true
                break
              }
              Write-Warning "Lan thu $i/$maxAttempts tai file that bai (ca 3 cach)."
              if ($i -lt $maxAttempts) { Start-Sleep -Seconds 15 }
            }

            if (-not $downloaded) { throw "Khong tai duoc file sau $maxAttempts lan thu (da thu 3 cach moi lan)" }

            if ($installerSha256) {
              $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
              if ($hash -ne $installerSha256.ToUpper()) {
                throw "SHA256 khong khop! Manifest: $installerSha256 - Thuc te: $hash"
              }
              Write-Host "SHA256 khop."
            }

            if ($installerType -and $installerType -ne "nullsoft") {
              Write-Warning "InstallerType la '$installerType', khong phai 'nullsoft'. Van thu chay voi /S."
            }

            Write-Host "Cai dat silent: $exePath /S"
            $proc = Start-Process -FilePath $exePath -ArgumentList "/S" -PassThru -Wait
            if ($proc.ExitCode -ne 0) { throw "Trinh cai dat tra ve exit code $($proc.ExitCode)" }

            # Doi vai giay de trinh cai dat ghi xong file (mot so installer thoat truoc khi copy xong)
            Start-Sleep -Seconds 5
            $success = $true
          }
          catch {
            Write-Warning "Khong the tai/cai dat phien ban ${version}: $($_.Exception.Message). Bo qua."
          }

          if ($success) {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "skip=true" >> $env:GITHUB_OUTPUT
          }

          # Luon thoat 0 de khong lam fail ca job khi mot phien ban bi bo qua
          exit 0

      - name: Tìm thư mục vừa cài đặt
        id: locate
        if: steps.install.outputs.skip == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:LOCALAPPDATA "Programs\Zalo"
          if (-not (Test-Path $base)) { throw "Khong tim thay $base" }

          # Uu tien thu muc phien ban "Zalo-x.y.z" - day moi la du lieu app that su can dong goi
          $verDir = Get-ChildItem $base -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^Zalo-\d' -and (Test-Path (Join-Path $_.FullName "Zalo.exe")) } |
            Sort-Object { [version]($_.Name -replace '^Zalo-', '') } |
            Select-Object -Last 1

          if ($verDir) {
            $dir = $verDir
          }
          else {
            $rootExe = Join-Path $base "Zalo.exe"
            if (Test-Path $rootExe) {
              $dir = Get-Item $base
            }
            else {
              $exe = Get-ChildItem $base -Recurse -Filter "Zalo.exe" -File -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if (-not $exe) { throw "Khong tim thay Zalo.exe ben trong $base" }
              $dir = $exe.Directory
            }
          }

          Write-Host "Thu muc se dong goi: $($dir.FullName)"
          echo "path=$($dir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Nén thư mục cài đặt
        id: zip
        if: steps.install.outputs.skip == 'false'
        shell: pwsh
        run: |
          $tag = "Zalo-${{ matrix.version }}"
          $zipName = "$tag.zip"
          Compress-Archive -Path "${{ steps.locate.outputs.path }}\*" -DestinationPath $zipName -Force
          Write-Host "Da nen: $zipName"
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Tạo GitHub Release
        if: steps.install.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.zip.outputs.tag }}"
          gh release create $tag "${{ steps.zip.outputs.zipname }}" `
            --repo $env:GITHUB_REPOSITORY `
            --title $tag `
            --notes "Tu dong dong goi tu winget-pkgs (VNGCorp.Zalo ${{ matrix.version }})."
